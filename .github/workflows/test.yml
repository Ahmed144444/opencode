name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.5'
      - run: bun install
      - run: bunx turbo typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.5'
      - run: bun install
      - run: bun test
        working-directory: packages/opencode
        env:
          # Increase timeout for slow filesystem operations
          BUN_TEST_TIMEOUT: '30000'
      - run: bun test
        working-directory: packages/enterprise
        env:
          OPENCODE_STORAGE_ADAPTER: 'memory'
          BUN_TEST_TIMEOUT: '30000'

  test-other-packages:
    name: Test Other Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.5'
      - run: bun install
      - run: bun test
        working-directory: packages/ui
      - run: bun test
        working-directory: packages/sdk/js
      - run: bun test
        working-directory: packages/util

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.5'
      - run: bun install
      - run: bunx prettier --check .

  build-opencode:
    name: Build opencode (Windows baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.5'
      - run: bun install
      - run: bun run script/build.ts --single --baseline
        working-directory: packages/opencode